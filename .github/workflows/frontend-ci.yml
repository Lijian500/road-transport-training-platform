name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "scripts/lib/media-config.*"
      - "scripts/run-media-acceptance.mjs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/lib/media-config.*"
      - "scripts/run-media-acceptance.mjs"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Unit tests
        working-directory: frontend
        run: pnpm test

      - name: Browser test type check
        working-directory: frontend
        run: pnpm typecheck:e2e

      - name: Media configuration guard tests
        run: node --test scripts/lib/media-config.test.mjs

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser contract tests
        working-directory: frontend
        run: pnpm test:e2e --project=ui
