name: ${COMPOSE_PROJECT_NAME:-road-training}

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: train-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_ADMIN_DATABASE: ${MYSQL_ADMIN_DATABASE:-road_training_admin}
      MYSQL_ADMIN_USER: ${MYSQL_ADMIN_USER:-train_admin}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:?请在根目录 .env 中设置 MYSQL_ADMIN_PASSWORD}
      MYSQL_TRAINING_DATABASE: ${MYSQL_TRAINING_DATABASE:-road_training_training}
      MYSQL_TRAINING_USER: ${MYSQL_TRAINING_USER:-train_training}
      MYSQL_TRAINING_PASSWORD: ${MYSQL_TRAINING_PASSWORD:?请在根目录 .env 中设置 MYSQL_TRAINING_PASSWORD}
      MYSQL_LEARNING_DATABASE: ${MYSQL_LEARNING_DATABASE:-road_training_learning}
      MYSQL_LEARNING_USER: ${MYSQL_LEARNING_USER:-train_learning}
      MYSQL_LEARNING_PASSWORD: ${MYSQL_LEARNING_PASSWORD:?请在根目录 .env 中设置 MYSQL_LEARNING_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - train-network

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: train-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在根目录 .env 中设置 REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?请在根目录 .env 中设置 REDIS_PASSWORD}",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - train-network

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4.1-management}
    container_name: train-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-train_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请在根目录 .env 中设置 RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - train-network

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.0.3}
    container_name: train-nacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "${NACOS_CONSOLE_PORT:-8088}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - train-network

  nginx:
    image: nginx:${NGINX_VERSION:-1.28-alpine}
    container_name: train-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-media:/srv/train/media:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - train-network

networks:
  train-network:
    name: train-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
  nginx-media:
