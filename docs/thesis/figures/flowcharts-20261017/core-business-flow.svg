<text x="765.0" y="314.32" text-anchor="middle" font-family="SimSun,serif" font-size="24">暂停视频与计时</text>
<text x="765.0" y="345.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">重连后重新绑定并同步确认位置</text>
<text x="765.0" y="376.72" text-anchor="middle" font-family="SimSun,serif" font-size="24">保持暂停，由学员手动继续</text>
