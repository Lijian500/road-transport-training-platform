<text x="765.0" y="531.2199999999999" text-anchor="middle" font-family="SimSun,serif" font-size="24">暂停播放，拍照并作 1∶1 比对</text>
<text x="765.0" y="562.42" text-anchor="middle" font-family="SimSun,serif" font-size="24">未通过且可重试：再次拍照</text>
<text x="765.0" y="593.62" text-anchor="middle" font-family="SimSun,serif" font-size="24">通过：保持暂停，手动继续</text>
<text x="765.0" y="624.82" text-anchor="middle" font-family="SimSun,serif" font-size="24">超时或次数耗尽：终止会话</text>
<text x="765.0" y="656.02" text-anchor="middle" font-family="SimSun,serif" font-size="24">保存核验过程与结果</text>
<text x="765.0" y="728.02" text-anchor="middle" font-family="SimSun,serif" font-size="24">课程完成条件</text>
<text x="765.0" y="770.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">全部课件完成且有效学时达标</text>
<text x="765.0" y="997.84" text-anchor="middle" font-family="SimSun,serif" font-size="23">档案随业务过程动态聚合，</text>
<text x="765.0" y="1027.74" text-anchor="middle" font-family="SimSun,serif" font-size="23">未完成或终止时也可查询留痕。</text>
