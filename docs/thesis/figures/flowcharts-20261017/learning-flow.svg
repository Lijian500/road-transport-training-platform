<text x="260.0" y="154.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">核验身份与会话绑定</text>
<polygon points="260.0,200 450,252.5 260.0,305 70,252.5" fill="white" stroke="black" stroke-width="1.4"/>
