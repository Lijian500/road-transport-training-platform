<text x="770.0" y="431.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">（ACK 与确认学时）</text>
<ellipse cx="770.0" cy="507.0" rx="80.0" ry="22.0" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="512.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">受理结束</text>
<text x="506.0" y="394.29" text-anchor="middle" font-family="SimSun,serif" font-size="23">是</text>
<rect x="610" y="570" width="320" height="60" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="605.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">返回对应校验错误</text>
<ellipse cx="770.0" cy="692.0" rx="80.0" ry="22.0" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="697.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">受理结束</text>
<text x="506.0" y="584.29" text-anchor="middle" font-family="SimSun,serif" font-size="23">否</text>
<text x="535.0" y="767.79" text-anchor="middle" font-family="SimSun,serif" font-size="23">按需异步</text>
<rect x="610" y="835" width="320" height="80" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="864.92" text-anchor="middle" font-family="SimSun,serif" font-size="24">读取已提交的</text>
<text x="770.0" y="896.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">待发送任务 Outbox</text>
<rect x="610" y="945" width="320" height="80" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="974.92" text-anchor="middle" font-family="SimSun,serif" font-size="24">RabbitMQ 至少一次投递</text>
<text x="770.0" y="1006.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">失败按策略重试</text>
<rect x="610" y="1045" width="320" height="80" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="1074.9199999999998" text-anchor="middle" font-family="SimSun,serif" font-size="24">培训服务幂等去重</text>
<text x="770.0" y="1106.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">按事件更新参训任务</text>
<ellipse cx="770.0" cy="1170.0" rx="80.0" ry="22.0" fill="white" stroke="black" stroke-width="1.4"/>
<text x="770.0" y="1175.52" text-anchor="middle" font-family="SimSun,serif" font-size="24">同步结束</text>
<text x="265.0" y="1141.34" text-anchor="middle" font-family="SimSun,serif" font-size="23">注：上报超时可成功受理并暂停，</text>
<text x="265.0" y="1171.24" text-anchor="middle" font-family="SimSun,serif" font-size="23">本次有效学时按规则计为 0。</text>
