<polygon points="260.0,355 450,410.0 260.0,465 70,410.0" fill="white" stroke="black" stroke-width="1.4"/>
<text x="260.0" y="399.92" text-anchor="middle" font-family="SimSun,serif" font-size="24">请求是否</text>
<text x="260.0" y="431.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">已经受理？</text>
<polygon points="260.0,540 450,600.0 260.0,660 70,600.0" fill="white" stroke="black" stroke-width="1.4"/>
<text x="260.0" y="589.92" text-anchor="middle" font-family="SimSun,serif" font-size="24">序号、状态、任务</text>
<text x="260.0" y="621.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">及位置均合法？</text>
<rect x="55" y="735" width="410" height="112" fill="white" stroke="black" stroke-width="1.4"/>
<text x="260.0" y="765.32" text-anchor="middle" font-family="SimSun,serif" font-size="24">按规则计算有效学时</text>
<text x="260.0" y="796.5200000000001" text-anchor="middle" font-family="SimSun,serif" font-size="24">事务保存学时、会话及事件</text>
<text x="260.0" y="827.72" text-anchor="middle" font-family="SimSun,serif" font-size="24">按需写入 Outbox</text>
<rect x="55" y="905" width="410" height="80" fill="white" stroke="black" stroke-width="1.4"/>
<text x="260.0" y="934.92" text-anchor="middle" font-family="SimSun,serif" font-size="24">返回 ACK 与确认学时</text>
<text x="260.0" y="966.12" text-anchor="middle" font-family="SimSun,serif" font-size="24">（无须等待异步结果）</text>
